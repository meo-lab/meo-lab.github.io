<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
(function() {
  var path = window.location.pathname;
  var search = window.location.search;
  var hash = window.location.hash;

  // Ordered most-specific first so lecture decks match before the overview catch-all
  var decks = [
    '/teaching/grl/1-why-geospatial-representation-learning/',
    '/teaching/grl/2-geospatial-data-images-maps-time-series/',
    '/teaching/grl/3-machine-learning-on-data-representations/',
    '/teaching/grl/4-deep-representation-learning-i/',
    '/teaching/grl/5-deep-representation-learning-ii/',
    '/teaching/grl/6-location-encoders-and-spatial-embeddings/',
    '/teaching/grl/7-self-supervised-deep-learning/',
    '/teaching/grl/8-geospatial-embeddings/',
    '/teaching/grl/9-synthesis-choosing-the-right-representation/',
    '/teaching/grl/'
  ];

  var base = null;
  for (var i = 0; i < decks.length; i++) {
    if (path.startsWith(decks[i]) || path === decks[i].slice(0, -1)) {
      base = decks[i];
      break;
    }
  }

  if (base) {
    // Redirect to the SPA's index.html, encoding the full original path as ?p=
    // The index.html will restore it via history.replaceState before Vue Router boots.
    window.location.replace(base + '?p=' + encodeURIComponent(path + search) + hash);
  }
})();
</script>
</head>
<body></body>
</html>
