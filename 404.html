<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
(function() {
  var path = window.location.pathname;
  var search = window.location.search;
  var hash = window.location.hash;

  // Ordered most-specific first so lecture decks match before the overview catch-all
  var decks = [
    '/teaching/grl/1-why-geospatial-representation-learning/',
    '/teaching/grl/2-geospatial-data-images-maps-time-series/',
    '/teaching/grl/3-deep-learning-for-geospatial-prediction/',
    '/teaching/grl/4-self-supervised-learning-and-foundation-models/',
    '/teaching/grl/5-earth-embeddings-and-location-encoders/',
    '/teaching/grl/6-spatiotemporal-representations-and-neural-fields/',
    '/teaching/grl/7-geospatial-retrieval-reasoning-and-agents/',
    '/teaching/grl/'
  ];

  var base = null;
  for (var i = 0; i < decks.length; i++) {
    if (path.startsWith(decks[i]) || path === decks[i].slice(0, -1)) {
      base = decks[i];
      break;
    }
  }

  if (base) {
    // Redirect to the SPA's index.html, encoding the full original path as ?p=
    // The index.html will restore it via history.replaceState before Vue Router boots.
    window.location.replace(base + '?p=' + encodeURIComponent(path + search) + hash);
  }
})();
</script>
</head>
<body></body>
</html>
